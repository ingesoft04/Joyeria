services:
  web:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      BASE_PATH: /joyeria
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-573000000000}
    ports:
      - "127.0.0.1:${APP_PORT:-3003}:3000"
    volumes:
      - joyeria_data:/app/storage
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  joyeria_data:
